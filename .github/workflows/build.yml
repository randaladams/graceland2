name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests and build APKs
        run: gradle testDebugUnitTest assembleDebug assembleRelease

      - name: Upload Debug APK (ready to install on Android)
        uses: actions/upload-artifact@v4
        with:
          name: graceland-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Unsigned Release APK
        uses: actions/upload-artifact@v4
        with:
          name: graceland-release-unsigned-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      - name: Publish direct APK download on GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk graceland-debug.apk
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest graceland-debug.apk --clobber
            gh release edit latest --target "${{ github.sha }}" --notes "Latest debug APK built from commit \`${{ github.sha }}\`."
          else
            gh release create latest graceland-debug.apk --title "Latest Build" --notes "Latest debug APK built from commit \`${{ github.sha }}\`." --target "${{ github.sha }}"
          fi
